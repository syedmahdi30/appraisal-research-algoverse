# Stage E — appraisal-SPECIFIC emotion steering (pilot). See pilot-plan-stage-e-f.md.
# Combines two TEXT-derived difference-of-means appraisal directions (Stage A v2 recipe) and
# injects the combination at resid_post L18 UNDER IMAGE INPUT, asking whether appraisal
# theory's predicted SPECIFIC emotion (anger/guilt/fear/pride/surprise) gains probability —
# not just a valence shift. Directions/probes stay frozen from Stage A; layer 18 only.
model: google/gemma-3-4b-it
device: cuda
split: test
seed: 0

# Injection site: resid_post at the Stage A critical layer (18), last prompt token.
steering_layers: [18]

# beta = multiples of the low->high Δμ shift (natural units, same as Stage D).
betas: [-3, -2, -1, 1, 2, 3]

# crowd-enVENT train examples used to estimate the six text-derived Δμ directions.
n_dir: 1200

# EMOTIC test images to steer (pilot: first 30 of the Stage D 150, seed 0).
n_images: 30

# All six appraisals get a Δμ direction (E1). Combos/arms are defined in stage_e_combo.py.
appraisals:
  - pleasantness
  - unpleasantness
  - suddenness
  - predict_event
  - self_responsblt
  - other_responsblt

# Entanglement threshold: pairs with |cos| > this use the Gram-Schmidt fallback (E3).
cos_flag_threshold: 0.6

# Matched-norm single-vs-combo control: for each congruent arm (A1-A5), also steer each of its
# two component directions rescaled to THAT combo's norm, so combo-vs-single differs only in
# direction, not magnitude — the clean test that the COMBINATION (not a bigger nudge) creates the
# specific emotion. Adds 10 arms (5 x 2); ~+67% forwards. Set false to skip.
matched_norm_control: true

# De-correlation of the appraisal directions before building combos:
#   none    — raw Δμ (the pilot default; appraisals are entangled, self_responsblt ~ valence).
#   valence — residualize every NON-valence appraisal against the bipolar valence axis
#             unit(pleasant) - unit(unpleasant), so a combo = valence + a valence-FREE appraisal.
#             This is the fair test of compositional emotion synthesis. Outputs are written with a
#             `_valence` suffix so they sit beside the raw run. CLI --decorrelate overrides this.
decorrelate: none
