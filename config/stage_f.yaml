# Stage F — modality conflict (pilot). See pilot-plan-stage-e-f.md.
# Pairs each person image with a conflicting/congruent one-sentence CONTEXT and asks which
# modality the shared appraisal read-out follows, then whether pleasantness Δμ steering can
# arbitrate. Frozen Stage A pleasantness probe (L18 hook_attn_out) + behavioral valence.
model: google/gemma-3-4b-it
device: cuda
split: test
seed: 0

# Frozen Stage A read-out site (probe was trained here; never re-fit).
critical_layer: 18
tap: hook_attn_out

# Base pass: pick the N/2 highest- and N/2 lowest-EMOTIC-valence test images (true extremes,
# derived directly from the EMOTIC test parquet — self-contained, no Stage C artifact needed).
n_images: 40

# Arbitration pass (--arbitrate): steer pleasantness Δμ at resid_post L18 on the incongruent
# cells and read BEHAVIORAL valence (the probe read-out at attn_out L18 is UPSTREAM of the
# resid_post injection, so it is invariant to steering by construction — recorded, not scored).
steering_layers: [18]
betas: [-3, -2, -1, 1, 2, 3]
n_dir: 1200
